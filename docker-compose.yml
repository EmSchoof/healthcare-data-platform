services:
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: healthcare-airflow
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////opt/airflow/airflow.db"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
      AIRFLOW_HOME: "/opt/airflow"
      PYTHONPATH: "/opt/airflow/repo"
      DBT_PROFILES_DIR: "/opt/airflow/dbt_profiles"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/dbt_profiles:/opt/airflow/dbt_profiles
      - ./airflow/config:/opt/airflow/config
      - ./dbt:/opt/airflow/dbt
      - ./src:/opt/airflow/src
      - ./:/opt/airflow/repo
    working_dir: /opt/airflow/repo
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create -u ${AIRFLOW_ADMIN_USERNAME} -f ${AIRFLOW_ADMIN_FIRSTNAME} -l ${AIRFLOW_ADMIN_LASTNAME} -r Admin -e ${AIRFLOW_ADMIN_EMAIL} -p ${AIRFLOW_ADMIN_PASSWORD} &&
      airflow standalone
      "
